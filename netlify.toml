[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Portfolio images carry a content hash in their name (npm run folio), so they never change under a name.
[[headers]]
  for = "/folio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The PDF keeps its name when replaced: always revalidate (cheap, a 304 when unchanged).
[[headers]]
  for = "/portfolio.pdf"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Disposition = "inline; filename=\"tmox-design-portfolio.pdf\""

[[headers]]
  for = "/~partytown/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Report-Only first: check the browser console on the live site, then rename to Content-Security-Policy.
    Content-Security-Policy-Report-Only = "default-src 'self'; img-src 'self' data: https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.googletagmanager.com; worker-src 'self' blob:; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
